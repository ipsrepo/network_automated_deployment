---
- name: Configure and deploy Docker web app
  hosts: web_server
  become: yes
  
  tasks:
    - name: Update packages (Amazon Linux)
      yum:
        name: "*"
        state: latest
      when: ansible_os_family == "RedHat"

    - name: Install Docker
      yum:
        name: docker
        state: present
      when: ansible_os_family == "RedHat"

    - name: Enable & start Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        groups: docker
        append: yes

    - name: Install pip
      yum:
        name: python3-pip
        state: present
      when: ansible_os_family == "RedHat"

    - name: Install Docker SDK for Python
      pip:
        name: docker
        state: present
        extra_args: --ignore-installed
      when: ansible_os_family == "RedHat"

    - name: Clean app directory on server (remove all existing files)
      file:
        path: /home/ec2-user/app
        state: absent

    - name: Create fresh app directory on server
      file:
        path: /home/ec2-user/app
        state: directory
        mode: '0755'

    - name: Copy application files to EC2 (overwrites everything)
      copy:
        src: ../app/
        dest: /home/ec2-user/app/
        mode: '0644'
        force: yes

    - name: Remove old Docker image and container completely
      shell: |
        docker stop web-app || true
        docker rm web-app || true
        docker rmi my-web-app:latest || true
      ignore_errors: yes
      register: cleanup_result

    - name: Build fresh Docker image using command
      command: docker build -t my-web-app:latest /home/ec2-user/app
      register: build_result
      changed_when: "'Successfully built' in build_result.stdout"
      failed_when: build_result.rc != 0

    - name: Run new container using command
      command: docker run -d --name web-app -p 80:80 --restart always my-web-app:latest
      register: run_result
      changed_when: run_result.rc == 0
      failed_when: run_result.rc != 0

    - name: Verify container is running
      shell: docker ps | grep web-app
      register: verify_result
      changed_when: false
      failed_when: verify_result.rc != 0

    - name: Show deployment status
      debug:
        msg: 
          - "✅ Container built and running successfully!"
          - "🌐 Website available at: http://52.48.24.168"
      when: build_result.changed or run_result.changed