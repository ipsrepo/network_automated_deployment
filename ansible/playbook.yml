---
- name: Configure and deploy Docker web app
  hosts: web_server
  become: yes
  
  tasks:
    - name: Update packages (Amazon Linux)
      yum:
        name: "*"
        state: latest
      when: ansible_os_family == "RedHat"

    - name: Install Docker
      yum:
        name: docker
        state: present
      when: ansible_os_family == "RedHat"

    - name: Enable & start Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        groups: docker
        append: yes

    - name: Install pip
      yum:
        name: python3-pip
        state: present
      when: ansible_os_family == "RedHat"

    - name: Install Docker SDK for Python
      pip:
        name: docker
        state: present
        extra_args: --ignore-installed
      when: ansible_os_family == "RedHat"

    - name: Clean app directory on server (remove all existing files)
      file:
        path: /home/ec2-user/app
        state: absent

    - name: Create fresh app directory on server
      file:
        path: /home/ec2-user/app
        state: directory
        mode: '0755'

    - name: Copy application files to EC2 (overwrites everything)
      copy:
        src: ../app/
        dest: /home/ec2-user/app/
        mode: '0644'
        force: yes  # Force overwrite existing files

    - name: Remove old Docker image and container completely
      shell: |
        docker stop web-app || true
        docker rm web-app || true
        docker rmi my-web-app:latest || true
      ignore_errors: yes

    - name: Build fresh Docker image (with no cache)
      docker_image:
        name: my-web-app
        tag: latest
        source: build
        build:
          path: /home/ec2-user/app
          pull: yes
          nocache: yes  # Force rebuild without cache
        force_source: yes
        state: present

    - name: Run new container
      docker_container:
        name: web-app
        image: my-web-app:latest
        state: started
        restart_policy: always
        ports:
          - "80:80"