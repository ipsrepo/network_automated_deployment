name: Deploy Web App to Existing EC2 Instance

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------
      # Setup SSH
      # ------------------------------
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/aws-key
          chmod 600 ~/.ssh/aws-key
          
          # Add host to known hosts to avoid prompt
          ssh-keyscan -H ${{ secrets.ELASTIC_IP }} >> ~/.ssh/known_hosts
        env:
          ELASTIC_IP: ${{ secrets.ELASTIC_IP }}

      - name: Test SSH connection
        run: |
          echo "🔍 Testing SSH connection to ${{ secrets.ELASTIC_IP }}..."
          ssh -i ~/.ssh/aws-key \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.ELASTIC_IP }} \
            "echo '✅ SSH connection successful' && hostname"

      # ------------------------------
      # Install Ansible
      # ------------------------------
      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      # ------------------------------
      # Create Ansible inventory with your Elastic IP
      # ------------------------------
      - name: Create Ansible inventory
        run: |
          cd ansible
          echo "[web_server]" > inventory.ini
          echo "${{ secrets.ELASTIC_IP }} ansible_user=${{ secrets.SSH_USER }} ansible_ssh_private_key_file=~/.ssh/aws-key" >> inventory.ini
          echo "📋 Using Elastic IP: ${{ secrets.ELASTIC_IP }}"
          cat inventory.ini

      # Disable host key checking for Ansible
      - name: Configure Ansible
        run: |
          mkdir -p ~/.ansible
          echo -e "[defaults]\nhost_key_checking = False" > ~/.ansible/ansible.cfg

      # ------------------------------
      # Deploy with Ansible
      # ------------------------------
      - name: Run Ansible playbook
        run: |
          echo "🚀 Deploying application to ${{ secrets.ELASTIC_IP }}..."
          ansible-playbook -i ansible/inventory.ini ansible/playbook.yml -v

      # ------------------------------
      # Verify Deployment
      # ------------------------------
      - name: Verify application is running
        run: |
          echo "🔍 Verifying web application at http://${{ secrets.ELASTIC_IP }}"
          
          # Wait a moment for container to restart
          sleep 5
          
          # Check HTTP status
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.ELASTIC_IP }})
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Application is responding with status 200"
          else
            echo "❌ Application returned status $HTTP_STATUS"
            exit 1
          fi

      # ------------------------------
      # Display Success Message
      # ------------------------------
      - name: Display deployment success
        run: |
          echo "========================================="
          echo "✅✅✅ DEPLOYMENT COMPLETE! ✅✅✅"
          echo "========================================="
          echo "🌐 Your application is live at:"
          echo "   http://${{ secrets.ELASTIC_IP }}"
          echo ""
          echo "🔄 Latest code has been deployed"
          echo "📅 Deployment time: $(date)"
          echo "========================================="

      # ------------------------------
      # Debug on Failure
      # ------------------------------
      - name: Debug on failure
        if: failure()
        run: |
          echo "🔍 DEBUG INFORMATION - DEPLOYMENT FAILED"
          echo "======================================="
          
          # Check if instance is reachable
          echo "📡 Testing connectivity to ${{ secrets.ELASTIC_IP }}:"
          ping -c 2 ${{ secrets.ELASTIC_IP }} || echo "❌ Instance not reachable"
          
          # Test SSH
          echo ""
          echo "🔑 Testing SSH:"
          ssh -i ~/.ssh/aws-key \
            -o ConnectTimeout=5 \
            -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.ELASTIC_IP }} \
            "echo 'SSH works'" || echo "❌ SSH failed"
          
          echo "======================================="