name: Deploy Web App to Existing EC2 Instance

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------
      # Setup SSH
      # ------------------------------
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/aws-key
          chmod 600 ~/.ssh/aws-key

      - name: Test SSH connection
        run: |
          echo "🔍 Testing SSH connection to ${{ secrets.ELASTIC_IP_ADDRESS }}..."
          ssh -i ~/.ssh/aws-key \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.ELASTIC_IP_ADDRESS }} \
            "echo '✅ SSH connection successful'"

      # ------------------------------
      # Install Ansible
      # ------------------------------
      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      # ------------------------------
      # Create Ansible inventory with your Elastic IP
      # ------------------------------
      - name: Create Ansible inventory
        run: |
          cd ansible
          echo "[web_server]" > inventory.ini
          echo "${{ secrets.ELASTIC_IP_ADDRESS }} ansible_user=${{ secrets.SSH_USER }} ansible_ssh_private_key_file=~/.ssh/aws-key" >> inventory.ini
          echo "📋 Using Elastic IP: ${{ secrets.ELASTIC_IP_ADDRESS }}"
          cat inventory.ini

      # Disable host key checking for Ansible
      - name: Configure Ansible
        run: |
          mkdir -p ~/.ansible
          echo -e "[defaults]\nhost_key_checking = False" > ~/.ansible/ansible.cfg

      # ------------------------------
      # Run Ansible Playbook
      # ------------------------------
      - name: Run Ansible playbook
        run: |
          echo "🚀 Running Ansible playbook on ${{ secrets.ELASTIC_IP_ADDRESS }}..."
          ansible-playbook -i ansible/inventory.ini ansible/playbook.yml -v

      # ------------------------------
      # Verify files were updated
      # ------------------------------
      - name: Verify HTML was updated
        run: |
          echo "🔍 Verifying HTML content on server..."
          
          # Get the first line of HTML from the server
          FIRST_LINE=$(ssh -i ~/.ssh/aws-key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.ELASTIC_IP_ADDRESS }} \
            "cat /home/ec2-user/app/index.html | head -1")
          
          echo "📄 First line of HTML: $FIRST_LINE"
          
          # Get the first line from local file
          LOCAL_FIRST_LINE=$(head -1 app/index.html)
          
          echo "📄 Local first line: $LOCAL_FIRST_LINE"
          
          if [ "$FIRST_LINE" = "$LOCAL_FIRST_LINE" ]; then
            echo "✅ HTML files match!"
          else
            echo "⚠️ HTML files may be different - check deployment"
          fi

      # ------------------------------
      # Verify application is running
      # ------------------------------
      - name: Verify application is running
        run: |
          echo "🔍 Verifying web application at http://${{ secrets.ELASTIC_IP_ADDRESS }}"
          
          # Wait a moment for container to restart
          sleep 5
          
          # Check HTTP status
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.ELASTIC_IP_ADDRESS }})
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Application is responding with status 200"
            
            # Get the actual HTML content
            curl -s http://${{ secrets.ELASTIC_IP_ADDRESS }} | grep -i "<title>" || echo "No title found"
          else
            echo "❌ Application returned status $HTTP_STATUS"
            exit 1
          fi

      # ------------------------------
      # Display Success Message
      # ------------------------------
      - name: Display deployment success
        run: |
          echo "========================================="
          echo "✅✅✅ DEPLOYMENT COMPLETE! ✅✅✅"
          echo "========================================="
          echo "🌐 Your application is live at:"
          echo "   http://${{ secrets.ELASTIC_IP_ADDRESS }}"
          echo ""
          echo "🔄 Latest HTML has been deployed (old version overwritten)"
          echo "📅 Deployment time: $(date)"
          echo "========================================="

      # ------------------------------
      # Debug on Failure
      # ------------------------------
      - name: Debug on failure
        if: failure()
        run: |
          echo "🔍 DEBUG INFORMATION - DEPLOYMENT FAILED"
          echo "======================================="
          
          # Check if instance is reachable
          echo "📡 Testing connectivity to ${{ secrets.ELASTIC_IP_ADDRESS }}:"
          ping -c 2 ${{ secrets.ELASTIC_IP_ADDRESS }} || echo "❌ Instance not reachable"
          
          # Test SSH
          echo ""
          echo "🔑 Testing SSH:"
          ssh -i ~/.ssh/aws-key \
            -o ConnectTimeout=5 \
            -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.ELASTIC_IP_ADDRESS }} \
            "echo 'SSH works'" || echo "❌ SSH failed"
          
          # Check what files are on the server
          echo ""
          echo "📂 Files on server:"
          ssh -i ~/.ssh/aws-key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.ELASTIC_IP_ADDRESS }} \
            "ls -la /home/ec2-user/app/ || echo 'Directory not found'"
          
          echo "======================================="